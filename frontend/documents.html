<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Materials | GDenAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">GDenAI</a>
        <div class="nav-links">
            <a href="index.html">Overview</a>
            <a href="documents.html" class="active">My Materials</a>
            <a href="chat.html">Query AI</a>
        </div>
    </nav>

    <main class="docs-main">
        <div class="page-header">
            <h1 class="page-title">Your Study Context</h1>
            <button class="btn-text" id="clear-btn">Clear All Materials</button>
        </div>
        
        <div class="large-upload-zone" id="drop-zone">
            <p>Drag and drop lecture materials, PDFs, or notes to add them to your context.</p>
            <button class="btn btn-outline" id="browse-btn">Browse Files</button>
            <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden>
        </div>

        <div class="docs-grid" id="documents-grid">
            <!-- Rendered by JS -->
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
