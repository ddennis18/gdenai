<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#601178">
    <title>Query AI | GDenAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">GDenAI</a>
        <div class="nav-links">
            <a href="index.html">Overview</a>
            <a href="documents.html">My Materials</a>
            <a href="chat.html" class="active">Query AI</a>
        </div>
    </nav>

    <div class="app-container" id="app-container">
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Sidebar: desktop column, mobile bottom sheet -->
        <aside class="sidebar" id="sidebar" aria-label="Active study materials">
            <div class="sidebar-head">
                <h2 class="sidebar-header">Active Context <span class="count-pill" data-doc-count>0</span></h2>
                <button class="btn-icon sidebar-close" type="button" id="sidebar-close" aria-label="Close materials panel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <label for="quick-file-input" class="quick-upload" id="quick-upload-btn">
                + Add document
                <input type="file" id="quick-file-input" accept=".pdf,.docx,.txt" hidden>
            </label>

            <div class="doc-list" id="sidebar-doc-list">
                <!-- Rendered by JS -->
            </div>

            <div class="sidebar-footer">
                <a href="documents.html">Manage materials &rarr;</a>
                <button class="btn-text" type="button" id="export-chat-btn">Export chat</button>
            </div>
        </aside>

        <!-- Main chat -->
        <main class="chat-main">
            <div class="chat-toolbar">
                <button class="sidebar-toggle" type="button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    Materials (<span data-doc-count>0</span>)
                </button>
                <span class="toolbar-hint">Answers cite your files</span>
            </div>

            <div class="chat-history" id="chat-history" role="log" aria-live="polite" aria-label="Conversation">
                <div class="message-group ai-group">
                    <div class="message-bubble ai-bubble">
                        Context loaded. Ask me anything based on your uploaded materials.
                    </div>
                </div>
            </div>

            <!-- Suggested prompts (hidden automatically after the first question) -->
            <div class="suggested-prompts">
                <button class="prompt-chip" type="button">Summarize these documents</button>
                <button class="prompt-chip" type="button">What are the key definitions?</button>
                <button class="prompt-chip" type="button">Explain the main concept simply</button>
            </div>

            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="Ask a specific question..." autocomplete="off" aria-label="Your question">
                <button class="btn btn-primary" id="send-btn" type="button">Send</button>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Mobile materials sheet (presentation only, independent of app.js)
        (function () {
            const app = document.getElementById('app-container');
            const toggle = document.getElementById('sidebar-toggle');
            const set = (open) => {
                app.classList.toggle('sidebar-open', open);
                toggle.setAttribute('aria-expanded', String(open));
            };
            toggle.addEventListener('click', () => set(!app.classList.contains('sidebar-open')));
            document.getElementById('sidebar-close').addEventListener('click', () => set(false));
            document.getElementById('sidebar-backdrop').addEventListener('click', () => set(false));
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
        })();
    </script>
</body>
</html>
